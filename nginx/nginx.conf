events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security Headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream to Next.js container
    upstream nextjs_upstream {
        server app:3000;
        keepalive 64;
    }

    # Rate Limiting for AI Chat API against token-draining attacks
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/m;
    limit_req_status 429;

    # HTTP Server (Redirect all traffic to canonical HTTPS autobox74.ru & Certbot Challenge)
    server {
        listen 80;
        server_name autobox74.ru www.autobox74.ru;

        # ACME-challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to canonical HTTPS autobox74.ru
        location / {
            return 301 https://autobox74.ru$request_uri;
        }
    }

    # HTTPS Redirect Server (www.autobox74.ru -> canonical autobox74.ru)
    server {
        listen 443 ssl http2;
        server_name www.autobox74.ru;

        # SSL Certificates paths from certbot
        ssl_certificate /etc/letsencrypt/live/autobox74.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/autobox74.ru/privkey.pem;

        # Hardened SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        return 301 https://autobox74.ru$request_uri;
    }

    # Main HTTPS Server (canonical autobox74.ru)
    server {
        listen 443 ssl http2;
        server_name autobox74.ru;

        # SSL Certificates paths from certbot
        ssl_certificate /etc/letsencrypt/live/autobox74.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/autobox74.ru/privkey.pem;

        # Hardened SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Rate limit on AI chat endpoint
        location /api/chat {
            limit_req zone=chat_limit burst=3 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Proxy to Next.js
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # Static assets cache
        location /_next/static {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
